<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Endless Download</title>
  <!-- base href so endless-download.js's relative asset paths (assets/img/...)
       resolve from the site root even though this page lives in /games -->
  <base href="../">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #c0c0c0; /* Win95 face — matches the desktop window chrome */
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      overflow: hidden;
    }
    .dl-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 6px;
      gap: 6px;
    }
    .game-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #000080;
      text-align: center;
      padding-top: 2px;
    }
    .canvas-frame {
      flex: 1;
      min-height: 0;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      background: #f0eacd;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      cursor: pointer;
    }
    .game-instructions {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: #000;
      text-align: center;
      padding-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="dl-shell">
    <div class="game-title">ENDLESS DOWNLOAD</div>
    <div class="canvas-frame">
      <canvas id="gameCanvas" width="1000" height="400"></canvas>
    </div>
    <p class="game-instructions">SPACE / CLICK TO JUMP &mdash; DODGE THE FIREWALLS</p>
  </div>
  <script src="endless-download.js"></script>
</body>
</html>
