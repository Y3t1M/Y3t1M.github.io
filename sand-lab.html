<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sand Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0b;
      color: #eaeaea;
      font-family: ui-sans-serif, system-ui, sans-serif;
      padding: 40px 24px 80px;
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .lede { color: #9a9a9a; font-size: 14px; margin-bottom: 28px; max-width: 60ch; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 18px;
      max-width: 1400px;
    }
    .tile {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      background: #060606;
    }
    .tile canvas { display: block; width: 100%; height: 300px; }
    .tile .meta {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .tile .meta b { font-size: 14px; }
    .tile .meta span {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10.5px;
      letter-spacing: 0.05em;
      color: #8a8a8a;
    }
  </style>
</head>

<body>
  <h1>Sand Lab</h1>
  <p class="lede">Same boiling-grain shader, six speeds/characters. A is what's live now. Tell me the letter (or "between C and D", "D but finer", etc.) and I'll ship it site-wide.</p>
  <div class="grid" id="grid"></div>

  <script>
  (function () {
    'use strict';

    var VARIANTS = [
      { key: 'A', label: 'Current (baseline)', drift: [0.025, 0.035], freq: [0.2, 0.4], jitter: 0.05, powExp: 6.0 },
      { key: 'B', label: '3× drift',           drift: [0.075, 0.105], freq: [0.2, 0.4], jitter: 0.05, powExp: 6.0 },
      { key: 'C', label: '6× drift',           drift: [0.15, 0.21],   freq: [0.2, 0.4], jitter: 0.05, powExp: 6.0 },
      { key: 'D', label: '3× drift · finer waves', drift: [0.075, 0.105], freq: [0.38, 0.62], jitter: 0.05, powExp: 6.0 },
      { key: 'E', label: '4× drift · shimmery',    drift: [0.1, 0.14],  freq: [0.26, 0.46], jitter: 0.085, powExp: 5.0 },
      { key: 'F', label: '8× drift · visible flow', drift: [0.2, 0.3],  freq: [0.3, 0.5], jitter: 0.05, powExp: 6.0 }
    ];

    var VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    var FS = [
      'precision highp float;',
      'uniform vec2 uRes;',
      'uniform float uT;',
      'uniform float uSeed;',
      'uniform vec2 uDrift;',
      'uniform vec2 uFreq;',
      'uniform float uJitter;',
      'uniform float uPowExp;',
      '#define PI 3.141592653589793',
      'vec3 mod289(vec3 x){return x - floor(x * (1.0/289.0)) * 289.0;}',
      'vec2 mod289(vec2 x){return x - floor(x * (1.0/289.0)) * 289.0;}',
      'vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}',
      'float snoise(vec2 v){',
      '  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);',
      '  vec2 i = floor(v + dot(v, C.yy));',
      '  vec2 x0 = v - i + dot(i, C.xx);',
      '  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);',
      '  vec4 x12 = x0.xyxy + C.xxzz;',
      '  x12.xy -= i1;',
      '  i = mod289(i);',
      '  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));',
      '  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);',
      '  m = m*m; m = m*m;',
      '  vec3 x = 2.0 * fract(p * C.www) - 1.0;',
      '  vec3 h = abs(x) - 0.5;',
      '  vec3 ox = floor(x + 0.5);',
      '  vec3 a0 = x - ox;',
      '  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);',
      '  vec3 g;',
      '  g.x = a0.x * x0.x + h.x * x0.y;',
      '  g.yz = a0.yz * x12.xz + h.yz * x12.yw;',
      '  return 130.0 * dot(m, g);',
      '}',
      'float hash(vec2 p){',
      '  vec3 p3 = fract(vec3(p.xyx) * 0.1031);',
      '  p3 += dot(p3, p3.yzx + 33.33);',
      '  return fract((p3.x + p3.y) * p3.z);',
      '}',
      'float snoise01(vec2 v){ return 0.5 + 0.5 * snoise(v); }',
      'float noise2d(vec2 st){ return snoise01(vec2(st.x + uT*uDrift.x, st.y - uT*uDrift.y + uSeed)); }',
      'float pattern(vec2 p){',
      '  vec2 q = vec2(noise2d(p), noise2d(p + vec2(5.2, 1.3)));',
      '  vec2 r = vec2(noise2d(p + 4.0*q + vec2(1.7, 9.2)), noise2d(p + 4.0*q + vec2(8.3, 2.8)));',
      '  return noise2d(p + r);',
      '}',
      'void main(){',
      '  vec2 uv = gl_FragCoord.xy / uRes;',
      '  vec2 px = floor(gl_FragCoord.xy);',
      '  float gr = pow(hash(px), 1.5);',
      '  float ga = hash(px + 917.0) * 2.0 * PI;',
      '  vec2 jitter = uJitter * gr * vec2(cos(ga), sin(ga));',
      '  float n = pattern(uv * uFreq + jitter);',
      '  n = smoothstep(0.0, 1.0, pow(n * 1.05, uPowExp));',
      '  gl_FragColor = vec4(vec3(0.55) * n * 0.5, 1.0);',
      '}'
    ].join('\n');

    function spawn(canvas, v) {
      var gl = canvas.getContext('webgl', { alpha: false, antialias: false });
      if (!gl) return;
      function sh(t, src) {
        var s = gl.createShader(t);
        gl.shaderSource(s, src); gl.compileShader(s);
        return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
      }
      var prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      var uRes = gl.getUniformLocation(prog, 'uRes');
      var uT = gl.getUniformLocation(prog, 'uT');
      gl.uniform1f(gl.getUniformLocation(prog, 'uSeed'), 42.0);
      gl.uniform2f(gl.getUniformLocation(prog, 'uDrift'), v.drift[0], v.drift[1]);
      gl.uniform2f(gl.getUniformLocation(prog, 'uFreq'), v.freq[0], v.freq[1]);
      gl.uniform1f(gl.getUniformLocation(prog, 'uJitter'), v.jitter);
      gl.uniform1f(gl.getUniformLocation(prog, 'uPowExp'), v.powExp);
      function resize() {
        var r = canvas.getBoundingClientRect();
        canvas.width = Math.floor(r.width);
        canvas.height = Math.floor(r.height);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(uRes, canvas.width, canvas.height);
      }
      resize();
      window.addEventListener('resize', resize);
      function frame(ts) {
        gl.uniform1f(uT, ts / 1000);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    var grid = document.getElementById('grid');
    VARIANTS.forEach(function (v) {
      var tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = '<canvas></canvas><div class="meta"><b>' + v.key + ' — ' + v.label + '</b>' +
        '<span>drift ' + v.drift.join('/') + ' · freq ' + v.freq.join('/') + ' · jit ' + v.jitter + ' · pow ' + v.powExp + '</span></div>';
      grid.appendChild(tile);
      spawn(tile.querySelector('canvas'), v);
    });
  })();
  </script>
</body>

</html>
