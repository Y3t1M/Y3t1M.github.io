<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favicon Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0b0b; color: #eaeaea; font-family: ui-sans-serif, system-ui, sans-serif; padding: 44px 28px 90px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .lede { color: #9a9a9a; font-size: 14px; margin-bottom: 32px; max-width: 62ch; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 18px; max-width: 1500px; }
    .tile {
      background: rgba(15,15,15,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 20px;
    }
    .tile h3 {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: #bdbdbd; margin-bottom: 14px;
    }
    .tile h3 b { color: #eaeaea; }
    .sizes { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; }
    .sz { text-align: center; }
    .sz span { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 9px; color: #6f6f6f; margin-top: 6px; }
    .sz svg { display: block; }
    .tab {
      display: flex; align-items: center; gap: 8px;
      border-radius: 9px 9px 0 0;
      padding: 8px 14px;
      font-size: 12px;
      width: 210px;
      margin-bottom: 6px;
    }
    .tab svg { width: 16px; height: 16px; flex-shrink: 0; }
    .tab.dark { background: #202124; color: #d5d7da; }
    .tab.light { background: #f1f3f4; color: #202124; }
  </style>
</head>

<body>
  <h1>Favicon Lab</h1>
  <p class="lede">Ten marks, each shown at 64 / 32 / 16 px plus real dark-tab and light-tab previews — judge them at 16px, that's where favicons live. Reply with a number.</p>
  <div class="grid" id="grid"></div>

  <script>
  (function () {
    'use strict';
    var BG = '#0b0b0b', FG = '#eaeaea', GOLD = '#c9a96e';
    var R = '<rect x="1" y="1" width="62" height="62" rx="14" fill="' + BG + '" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>';

    function svg(inner) {
      return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
    }

    var parenL = '<path d="M22 18 Q14 32 22 46" fill="none" stroke="' + FG + '" stroke-width="3.6" stroke-linecap="round"/>';
    var parenR = '<path d="M42 18 Q50 32 42 46" fill="none" stroke="' + FG + '" stroke-width="3.6" stroke-linecap="round"/>';

    var DESIGNS = [
      { name: 'FACE — the full ( ._.)', body: R + parenL + parenR +
        '<circle cx="28" cy="36" r="2.6" fill="' + FG + '"/><circle cx="36" cy="36" r="2.6" fill="' + FG + '"/>' +
        '<rect x="29" y="41.5" width="6" height="2.6" rx="1.3" fill="' + FG + '"/>' },

      { name: 'LED FACE — dot-matrix mascot', body: R + (function () {
          var lit = { '1,2':1,'1,3':1,'1,4':1,'6,2':1,'6,3':1,'6,4':1,'3,3':1,'4,3':1,'3,5':0,'3.5,5':0 };
          var s = '';
          for (var gy = 1; gy <= 6; gy++) for (var gx = 0; gx <= 7; gx++) {
            var x = 11 + gx * 6, y = 8 + gy * 6.6;
            var on = lit[gx + ',' + gy];
            s += '<circle cx="' + x + '" cy="' + y + '" r="' + (on ? 2.1 : 1) + '" fill="' + (on ? FG : 'rgba(255,255,255,0.12)') + '"/>';
          }
          s += '<rect x="27" y="43" width="10" height="3" rx="1.5" fill="' + FG + '"/>';
          return s;
        })() },

      { name: 'HT — monogram', body: R +
        '<rect x="13" y="17" width="6" height="30" fill="' + FG + '"/>' +
        '<rect x="26" y="17" width="6" height="30" fill="' + FG + '"/>' +
        '<rect x="13" y="29" width="19" height="6" fill="' + FG + '"/>' +
        '<rect x="36" y="17" width="15" height="6" fill="' + FG + '"/>' +
        '<rect x="40.5" y="17" width="6" height="30" fill="' + FG + '"/>' },

      { name: 'TERRAIN — the hero waves', body: R +
        '<path d="M10 26 Q22 20 32 26 T54 26" fill="none" stroke="' + FG + '" stroke-width="2.2" opacity="0.45"/>' +
        '<path d="M10 35 Q22 28 32 35 T54 35" fill="none" stroke="' + FG + '" stroke-width="2.6" opacity="0.7"/>' +
        '<path d="M10 45 Q22 36 32 45 T54 45" fill="none" stroke="' + FG + '" stroke-width="3" />' },

      { name: 'TERRAIN + LED — waves with the D1 dot', body: R +
        '<path d="M10 30 Q22 24 32 30 T54 30" fill="none" stroke="' + FG + '" stroke-width="2.4" opacity="0.55"/>' +
        '<path d="M10 41 Q22 33 32 41 T54 41" fill="none" stroke="' + FG + '" stroke-width="3"/>' +
        '<circle cx="46" cy="20" r="3.4" fill="' + GOLD + '"/>' },

      { name: 'AWARE — card in the sand', body: R + (function () {
          var s = '<rect x="21" y="23" width="22" height="18" rx="5" fill="none" stroke="' + FG + '" stroke-width="2.6"/>';
          var pts = [[12,14],[50,12],[55,26],[9,32],[13,50],[30,52],[48,50],[54,42],[31,12],[9,20]];
          for (var i = 0; i < pts.length; i++) s += '<circle cx="' + pts[i][0] + '" cy="' + pts[i][1] + '" r="1.4" fill="rgba(234,234,234,0.7)"/>';
          return s;
        })() },

      { name: 'CURSOR — the site arrow', body: R +
        '<path d="M24 16 L24 45 Q24 51 28 46.5 L34.5 39.5 L44.5 39.4 Q51 39.2 46.5 35.2 L27.5 15.8 Q24 12.4 24 16 Z" fill="' + FG + '" stroke="' + BG + '" stroke-width="1.5"/>' },

      { name: 'MINIMAL — just ._.', body: R +
        '<circle cx="20" cy="34" r="3.4" fill="' + FG + '"/><circle cx="44" cy="34" r="3.4" fill="' + FG + '"/>' +
        '<rect x="26" y="40" width="12" height="3.4" rx="1.7" fill="' + FG + '"/>' },

      { name: 'HORNS — the ascii yeti', body: R +
        '<path d="M20 44 Q12 30 20 18 Q22 15 23 18" fill="none" stroke="' + FG + '" stroke-width="3.4" stroke-linecap="round"/>' +
        '<path d="M44 44 Q52 30 44 18 Q42 15 41 18" fill="none" stroke="' + FG + '" stroke-width="3.4" stroke-linecap="round"/>' +
        '<circle cx="32" cy="36" r="3" fill="' + FG + '"/>' },

      { name: 'WAVE-H — H with a wave crossbar', body: R +
        '<rect x="17" y="15" width="6.5" height="34" fill="' + FG + '"/>' +
        '<rect x="40.5" y="15" width="6.5" height="34" fill="' + FG + '"/>' +
        '<path d="M23.5 32 Q28 26 32 32 T40.5 32" fill="none" stroke="' + FG + '" stroke-width="4"/>' }
    ];

    var grid = document.getElementById('grid');
    DESIGNS.forEach(function (d, i) {
      var mark = svg(d.body);
      var tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML =
        '<h3><b>' + (i + 1) + '</b> — ' + d.name + '</h3>' +
        '<div class="sizes">' +
          '<div class="sz"><div style="width:64px;height:64px">' + mark + '</div><span>64</span></div>' +
          '<div class="sz"><div style="width:32px;height:32px">' + mark + '</div><span>32</span></div>' +
          '<div class="sz"><div style="width:16px;height:16px">' + mark + '</div><span>16</span></div>' +
        '</div>' +
        '<div class="tab dark">' + mark + ' Hudson Tinch</div>' +
        '<div class="tab light">' + mark + ' Hudson Tinch</div>';
      grid.appendChild(tile);
    });
  })();
  </script>
</body>

</html>
