<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Tuner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0b0b; color: #eaeaea; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .open-copy { position: absolute; left: 8%; top: 20%; z-index: 2; max-width: 680px; }
    .des {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #bdbdbd; margin-bottom: 16px;
    }
    h1 { font-size: clamp(34px, 4.6vw, 58px); line-height: 1.12; font-weight: 750; letter-spacing: -0.02em; margin-bottom: 12px; text-shadow: 0 2px 26px rgba(0,0,0,0.9); }
    .sub { color: #9a9a9a; font-size: 15.5px; margin-bottom: 22px; }
    .btns { display: flex; gap: 10px; }
    .b1 { background: #eaeaea; color: #0b0b0b; font-weight: 650; font-size: 13.5px; border: 0; border-radius: 999px; padding: 10px 18px; }
    .b2 { background: none; color: #eaeaea; font-size: 13.5px; border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; padding: 10px 18px; }

    #tuner {
      position: fixed; right: 18px; top: 18px; z-index: 10;
      background: rgba(13,13,13,0.94);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      padding: 18px 20px;
      width: 270px;
    }
    #tuner h2 {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
      color: #8a8a8a; margin-bottom: 14px; font-weight: 600;
    }
    .tk { margin-bottom: 12px; }
    .tk label {
      display: flex; justify-content: space-between;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      color: #9a9a9a; margin-bottom: 5px;
    }
    .tk label b { color: #eaeaea; font-weight: 400; font-variant-numeric: tabular-nums; }
    .tk input { width: 100%; accent-color: #eaeaea; }
    #readout {
      margin-top: 10px; padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10px; line-height: 1.7; color: #8a8a8a;
      user-select: all;
    }
  </style>
</head>

<body>
  <div id="stage">
    <canvas id="tc"></canvas>
    <div class="open-copy">
      <div class="des">Hudson Tinch · Dallas, TX</div>
      <h1>Studying business.<br>Shipping software.</h1>
      <p class="sub">Developer at Hollis Bloom. Business student at Arkansas.</p>
      <div class="btns"><button class="b1">View projects</button><button class="b2">Resume</button></div>
    </div>
  </div>

  <div id="tuner">
    <h2>Wave Tuner — send me the readout</h2>
    <div class="tk"><label>Horizon <b id="vhz">0.24</b></label><input id="hz" type="range" min="0.10" max="0.55" step="0.01" value="0.24"></div>
    <div class="tk"><label>Rows <b id="vrw">32</b></label><input id="rw" type="range" min="14" max="52" step="1" value="32"></div>
    <div class="tk"><label>Amplitude <b id="vam">1.00</b></label><input id="am" type="range" min="0.3" max="2.2" step="0.05" value="1.0"></div>
    <div class="tk"><label>Wavelength <b id="vwl">1.00</b></label><input id="wl" type="range" min="0.4" max="2.5" step="0.05" value="1.0"></div>
    <div class="tk"><label>Speed <b id="vsp">1.00</b></label><input id="sp" type="range" min="0.2" max="3" step="0.05" value="1.0"></div>
    <div class="tk"><label>Detail <b id="vdt">0.35</b></label><input id="dt" type="range" min="0" max="0.9" step="0.05" value="0.35"></div>
    <div class="tk"><label>Brightness <b id="vbr">1.00</b></label><input id="br" type="range" min="0.4" max="2" step="0.05" value="1.0"></div>
    <div class="tk"><label>Persp. pinch <b id="vpp">0.75</b></label><input id="pp" type="range" min="0" max="1.5" step="0.05" value="0.75"></div>
    <div id="readout"></div>
  </div>

  <script>
  (function () {
    'use strict';
    var P = { hz: 0.24, rw: 32, am: 1, wl: 1, sp: 1, dt: 0.35, br: 1, pp: 0.75 };
    var fmt = { hz: 2, rw: 0, am: 2, wl: 2, sp: 2, dt: 2, br: 2, pp: 2 };
    Object.keys(P).forEach(function (k) {
      var el = document.getElementById(k);
      el.addEventListener('input', function () {
        P[k] = parseFloat(el.value);
        document.getElementById('v' + k).textContent = P[k].toFixed(fmt[k]);
        readout();
      });
    });
    function readout() {
      document.getElementById('readout').textContent =
        'horizon=' + P.hz.toFixed(2) + ' rows=' + P.rw + ' amp=' + P.am.toFixed(2) +
        ' wl=' + P.wl.toFixed(2) + ' speed=' + P.sp.toFixed(2) + ' detail=' + P.dt.toFixed(2) +
        ' bright=' + P.br.toFixed(2) + ' pinch=' + P.pp.toFixed(2);
    }
    readout();

    var stage = document.getElementById('stage');
    var canvas = document.getElementById('tc');
    var ctx = canvas.getContext('2d');
    var W = 0, H = 0;
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    var mouse = { x: -9999, y: -9999, sx: -9999, sy: -9999 };
    stage.addEventListener('pointermove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
    stage.addEventListener('pointerleave', function () { mouse.x = -9999; mouse.y = -9999; });
    var waves = [];
    stage.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.open-copy') || e.target.closest('#tuner')) return;
      waves.push({ x: e.clientX, y: e.clientY, t0: performance.now() / 1000 });
      if (waves.length > 6) waves.shift();
    });

    function hash(x, y) {
      var h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return h - Math.floor(h);
    }
    function vnoise(x, y) {
      var xi = Math.floor(x), yi = Math.floor(y);
      var xf = x - xi, yf = y - yi;
      var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      var a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    function fieldN(nx, z, t) {
      return vnoise(nx * 1.7 / P.wl + 7.3, (1 - z) * 3.2 - t * 0.05 * P.sp)
           + P.dt * vnoise(nx * 3.6 / P.wl + 2.1, (1 - z) * 6.5 - t * 0.08 * P.sp);
    }
    function extras(x, y0, zz, t) {
      var d = 0;
      if (mouse.sx > -999) {
        var dxm = x - mouse.sx, dym = y0 - mouse.sy;
        d += Math.exp(-(dxm * dxm + dym * dym) / 30000) * 56 * (0.3 + zz);
      }
      for (var w = 0; w < waves.length; w++) {
        var wv = waves[w];
        var age = t - wv.t0;
        if (age > 4.5) continue;
        var dxw = x - wv.x, dyw = y0 - wv.y;
        var dist = Math.sqrt(dxw * dxw + dyw * dyw);
        var band = Math.exp(-Math.pow(dist - age * 170, 2) / 3000);
        d += band * 42 * Math.exp(-age * 0.9) * (0.3 + zz) * Math.sin(age * 5.5);
      }
      return d;
    }

    function frame(ts) {
      var t = ts / 1000;
      ctx.clearRect(0, 0, W, H);
      if (mouse.x > -999) {
        if (mouse.sx < -999) { mouse.sx = mouse.x; mouse.sy = mouse.y; }
        mouse.sx += (mouse.x - mouse.sx) * 0.08;
        mouse.sy += (mouse.y - mouse.sy) * 0.08;
      } else { mouse.sx = -9999; mouse.sy = -9999; }

      var horizon = H * P.hz;
      var rows = P.rw;
      for (var r = 0; r < rows; r++) {
        var z = r / rows;
        var zz = Math.pow(z, 1.7);
        var y0 = horizon + zz * (H - horizon) * 1.05;
        var amp = (14 + zz * 74) * P.am;
        ctx.strokeStyle = 'rgba(234,234,234,' + Math.min(0.5, (0.05 + zz * 0.18) * P.br) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var i = 0; i <= 110; i++) {
          var x = (i / 110) * W;
          var nx = (i / 110 - 0.5) / (0.25 + z * P.pp);
          var y = y0 - fieldN(nx, z, t) * amp - extras(x, y0, zz, t);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      waves = waves.filter(function (wv) { return t - wv.t0 < 4.5; });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>

</html>
