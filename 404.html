<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Hudson Tinch</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    #led-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 26px;
      position: relative;
      z-index: 1;
      padding: 24px 24px 16vh;
    }
    .nf-code {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    .nf-code b { color: var(--text); font-weight: 600; }
  </style>
</head>

<body>

  <canvas id="led-bg"></canvas>

  <header class="site-header" style="position: relative; z-index: 2;">
    <nav class="site-nav">
      <div class="nav-logo"><span class="nav-logo-text">Hudson Tinch</span></div>
      <div class="nav-links">
        <a href="/index.html" class="nav-link">Home</a>
        <a href="/projects.html" class="nav-link">Projects</a>
      </div>
      <div class="nav-cta">
        <a href="/assets/Hudson-Tinch-Resume.pdf" target="_blank" rel="noopener" class="btn-ghost">Resume</a>
      </div>
    </nav>
  </header>

  <div class="nf-wrap">
    <div class="nf-code"><b>404</b> · TRACE NOT FOUND</div>
    <a href="/index.html" class="btn-primary">Back to the site</a>
  </div>

  <script>
  (function () {
    'use strict';
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var canvas = document.getElementById('led-bg');
    var ctx = canvas.getContext('2d');

    /* one LED matrix for the whole viewport; the face is lit cells within it */
    var GW = 64, GH = 32;                 // face pattern resolution
    var cell = 9, cols = 0, rows = 0;
    var faceCol = 0, faceRow = 0;         // face origin in grid cells

    /* static face pattern (parens + mouth) sampled once */
    var facePat = null;
    function buildFace() {
      var off = document.createElement('canvas');
      off.width = GW; off.height = GH;
      var octx = off.getContext('2d');
      octx.fillStyle = '#fff';
      octx.font = '700 26px ui-monospace, Menlo, monospace';
      octx.textBaseline = 'middle';
      octx.fillText('(', 6, GH / 2);
      octx.fillText(')', GW - 12, GH / 2);
      octx.fillText('_', 24, GH / 2 - 2);
      var d = octx.getImageData(0, 0, GW, GH).data;
      facePat = new Float32Array(GW * GH);
      for (var i = 0; i < GW * GH; i++) facePat[i] = d[i * 4 + 3] / 255;
    }
    buildFace();

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      var faceW = Math.min(560, window.innerWidth * 0.92);
      cell = faceW / GW;
      cols = Math.ceil(canvas.width / cell) + 1;
      rows = Math.ceil(canvas.height / cell) + 1;
      faceCol = Math.round((cols - GW) / 2);
      faceRow = Math.round((canvas.height * 0.40) / cell - GH / 2);
    }
    resize();
    window.addEventListener('resize', resize);

    /* cursor-tracked eyes with smooth follow */
    var mouse = { x: -9999, y: -9999 };
    document.addEventListener('pointermove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
    var eye = { x: 0, y: 0 };             // smoothed offset in cells

    var nextBlink = 4 + Math.random() * 5;
    var blinkStart = -1;
    function blinkAmount(t) {
      if (blinkStart < 0) {
        if (t > nextBlink) blinkStart = t;
        return 0;
      }
      var e = t - blinkStart;
      if (e >= 0.6) { blinkStart = -1; nextBlink = t + 5 + Math.random() * 5; return 0; }
      if (e < 0.25) { var u = e / 0.25; return u * u * (3 - 2 * u); }
      if (e < 0.35) return 1;
      var v = (e - 0.35) / 0.25;
      return 1 - v * v * (3 - 2 * v);
    }

    /* coverage of cell [c, r] by a float rect (cx, cy, w, h) */
    function cover(c, r, rx, ry, rw, rh) {
      var x0 = Math.max(c, rx), x1 = Math.min(c + 1, rx + rw);
      var y0 = Math.max(r, ry), y1 = Math.min(r + 1, ry + rh);
      if (x1 <= x0 || y1 <= y0) return 0;
      return (x1 - x0) * (y1 - y0);
    }

    function draw(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      /* eyes: face-space float rects, tracked toward the cursor */
      var faceCx = (faceCol + GW / 2) * cell;
      var faceCy = (faceRow + GH / 2) * cell;
      var tx = mouse.x > -999 ? Math.max(-4.5, Math.min(4.5, (mouse.x - faceCx) / 120)) : 0;
      var ty = mouse.y > -999 ? Math.max(-3.0, Math.min(3.0, (mouse.y - faceCy) / 120)) : 0;
      eye.x += (tx - eye.x) * 0.14;
      eye.y += (ty - eye.y) * 0.14;

      var b = blinkAmount(t);
      var eyeH = Math.max(0.5, 3.4 * (1 - b));
      var eyeW = 3.2;
      var eyeYbase = GH / 2 - 3.4 + (3.4 - eyeH) / 2 + eye.y * 0.9;
      var eyes = [
        [21.4 + eye.x, eyeYbase, eyeW, eyeH],
        [38.4 + eye.x, eyeYbase, eyeW, eyeH]
      ];

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var a = 0.032;                          // the unified unlit matrix
          var fc = c - faceCol, fr = r - faceRow;
          if (fc >= 0 && fc < GW && fr >= 0 && fr < GH) {
            var lit = facePat[fr * GW + fc];
            for (var e2 = 0; e2 < 2; e2++) {
              lit += cover(fc, fr, eyes[e2][0], eyes[e2][1], eyes[e2][2], eyes[e2][3]);
            }
            lit = Math.min(1, lit);
            if (lit > 0.1) a = 0.22 + 0.78 * lit;
          }
          ctx.fillStyle = 'rgba(234,234,234,' + a.toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(c * cell + cell / 2, r * cell + cell / 2, cell * (a > 0.1 ? 0.3 : 0.16), 0, 7);
          ctx.fill();
        }
      }
    }

    if (reduced) { draw(1); return; }
    var rafId = null;
    function frame(ts) { draw(ts / 1000); rafId = requestAnimationFrame(frame); }
    rafId = requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { if (rafId) cancelAnimationFrame(rafId); rafId = null; }
      else if (!rafId) rafId = requestAnimationFrame(frame);
    });
  })();
  </script>
  <script src="/transitions.js"></script>
</body>

</html>
