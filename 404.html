<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Hudson Tinch</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    #dot-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .nf-wrap {
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      position: relative;
      z-index: 1;
      padding: 24px;
    }
    #led-face { width: min(560px, 92vw); height: auto; }
    .nf-code {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    .nf-code b { color: var(--text); font-weight: 600; }
  </style>
</head>

<body>

  <canvas id="dot-bg"></canvas>

  <header class="site-header">
    <nav class="site-nav">
      <div class="nav-logo"><span class="nav-logo-text">Hudson Tinch</span></div>
      <div class="nav-links">
        <a href="/index.html" class="nav-link">Home</a>
        <a href="/projects.html" class="nav-link">Projects</a>
      </div>
      <div class="nav-cta">
        <a href="/assets/Hudson-Tinch-Resume.pdf" download class="btn-ghost">Resume</a>
      </div>
    </nav>
  </header>

  <div class="nf-wrap">
    <canvas id="led-face" width="640" height="320"></canvas>
    <div class="nf-code"><b>404</b> · TRACE NOT FOUND</div>
    <a href="/index.html" class="btn-primary">Back to the site</a>
  </div>

  <script>
  (function () {
    'use strict';
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var mouse = { x: -9999, y: -9999 };
    document.addEventListener('pointermove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });

    /* ---- dot-grid background with a gentle cursor part ---- */
    var bg = document.getElementById('dot-bg');
    var bctx = bg.getContext('2d');
    function bgResize() { bg.width = window.innerWidth; bg.height = window.innerHeight; }
    bgResize();
    window.addEventListener('resize', bgResize);
    function drawBg() {
      var W = bg.width, H = bg.height;
      bctx.clearRect(0, 0, W, H);
      var g = 24;
      for (var y = g / 2; y < H; y += g) {
        for (var x = g / 2; x < W; x += g) {
          var dx = x - mouse.x, dy = y - mouse.y;
          var d2 = dx * dx + dy * dy;
          var push = Math.exp(-d2 / 9000);
          var len = Math.sqrt(d2) || 1;
          bctx.fillStyle = 'rgba(234,234,234,' + (0.045 + push * 0.2) + ')';
          bctx.fillRect(x + (dx / len) * push * 12, y + (dy / len) * push * 12, 1.2, 1.2);
        }
      }
    }

    /* ---- LED face: stable render, smooth tracked eyes, slow eased blinks ---- */
    var canvas = document.getElementById('led-face');
    var ctx = canvas.getContext('2d');
    var off = document.createElement('canvas');
    var octx = off.getContext('2d', { willReadFrequently: true });

    var nextBlink = 4 + Math.random() * 5;
    var blinkStart = -1;
    var BLINK_DUR = 0.6;                 // slow, controlled: 0.25s close, 0.1 hold, 0.25 open

    function blinkAmount(t) {
      if (blinkStart < 0) return 0;
      var e = t - blinkStart;
      if (e >= BLINK_DUR) { blinkStart = -1; nextBlink = t + 5 + Math.random() * 5; return 0; }
      if (e < 0.25) { var u = e / 0.25; return u * u * (3 - 2 * u); }         // ease close
      if (e < 0.35) return 1;                                                  // hold
      var v = (e - 0.35) / 0.25;
      return 1 - v * v * (3 - 2 * v);                                          // ease open
    }

    function draw(t) {
      if (blinkStart < 0 && t > nextBlink) blinkStart = t;
      var W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      var gw = 64, gh = 32;
      off.width = gw; off.height = gh;
      octx.clearRect(0, 0, gw, gh);
      octx.fillStyle = '#fff';
      octx.font = '700 26px ui-monospace, Menlo, monospace';
      octx.textBaseline = 'middle';
      octx.fillText('(', 6, gh / 2);
      octx.fillText(')', gw - 12, gh / 2);
      octx.fillText('_', 27, gh / 2 - 2);       // mouth (static — no resample jitter)

      /* eyes as drawn blocks: track smoothly, blink by squashing */
      var r = canvas.getBoundingClientRect();
      var scale = r.width / W || 1;
      var mx = (mouse.x - r.left) / scale, my = (mouse.y - r.top) / scale;
      var dx = Math.max(-2, Math.min(2, (mx - W / 2) / 200));
      var dy = Math.max(-1.5, Math.min(1.5, (my - H / 2) / 200));
      var b = blinkAmount(t);
      var eyeH = Math.max(0.6, 3.4 * (1 - b));
      var eyeY = gh / 2 - 2 + dy + (3.4 - eyeH) / 2;
      octx.fillRect(21 + dx, eyeY, 3.2, eyeH);
      octx.fillRect(37 + dx, eyeY, 3.2, eyeH);

      var data = octx.getImageData(0, 0, gw, gh).data;
      var cellW = W / gw, cellH = H / gh;
      for (var y = 0; y < gh; y++) {
        for (var x = 0; x < gw; x++) {
          var a = data[(y * gw + x) * 4 + 3] / 255;
          var px = x * cellW + cellW / 2;
          var py = y * cellH + cellH / 2;
          ctx.beginPath();
          if (a > 0.12) {
            ctx.fillStyle = 'rgba(234,234,234,' + (0.25 + 0.75 * a) + ')';
            ctx.arc(px, py, Math.min(cellW, cellH) * 0.32, 0, 7);
          } else {
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.arc(px, py, Math.min(cellW, cellH) * 0.18, 0, 7);
          }
          ctx.fill();
        }
      }
    }

    if (reduced) { draw(1); drawBg(); return; }
    function frame(ts) {
      var t = ts / 1000;
      drawBg();
      draw(t);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
  <script src="/transitions.js"></script>
</body>

</html>
